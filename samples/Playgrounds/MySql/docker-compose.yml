services:
  mysql:
    image: mysql:8.0.36
    container_name: sqlbuilder_mysql_playground
    environment:
      MYSQL_ROOT_PASSWORD: Root@Secure1!
      MYSQL_DATABASE:      sqlbuilder_demo
      MYSQL_USER:          demo
      MYSQL_PASSWORD:      Demo@SqlB1!
    ports:
      - "3307:3306"
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --default-authentication-plugin=mysql_native_password
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "demo", "-pDemo@SqlB1!"]
      interval: 5s
      timeout: 5s
      retries: 15
    networks:
      - mysql_net

networks:
  mysql_net:
    driver: bridge
