services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: sqlbuilder_mssql_playground
    environment:
      ACCEPT_EULA:       "Y"
      MSSQL_SA_PASSWORD: "SqlBuild3r@Str0ng!"
      MSSQL_PID:         "Developer"
    ports:
      - "1434:1433"
    healthcheck:
      test: [
        "CMD-SHELL",
        "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'SqlBuild3r@Str0ng!' -No -Q 'SELECT 1' || exit 1"
      ]
      interval: 10s
      timeout: 10s
      retries: 15
    networks:
      - mssql_net

networks:
  mssql_net:
    driver: bridge
